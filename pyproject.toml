[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "farmos-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents interact with farmOS via its JSON:API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "farmos", "farm", "agent", "jsonapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.10,<2",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
farmos-mcp = "farmos_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/farmos_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "test", "README.md"]
